{% set name = "osdagbridge" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  entry_points:
    - osdag_bridge = osdagbridge.desktop.__main__:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61.0
    - wheel
    
  run:
    - python >=3.9
    - numpy >=1.21,<2.0
    - scipy >=1.8
    - matplotlib >=3.5
    - pyyaml >=6.0
    - pydantic >=2.0
    - pyside6 >=6.4
    - fiona >=1.8
    - shapely >=2.0

test:
  imports:
    - osdagbridge

about:
  home: https://github.com/Aditya-Donde/OsdagBridge
  license: GNU GENERAL PUBLIC LICENSE Version 3 (GPL-3.0)
  license_file: LICENSE.txt
  summary: 'Bridge design and analysis software'

extra:
  recipe-maintainers:
    - garvit000